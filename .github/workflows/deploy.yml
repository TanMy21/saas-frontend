name: Deploy Creator Frontend

on:
  push:
    branches:
      - deploy

concurrency:
  group: creator-production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_REACT_APP_NODE_ENV: ${{ vars.VITE_REACT_APP_NODE_ENV }}
      VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
      VITE_SHARE_BASE_URL: ${{ vars.VITE_SHARE_BASE_URL }}
      VITE_ENABLE_TOUR: ${{ vars.VITE_ENABLE_TOUR }}
      VITE_ENABLE_BUILDER_TOUR: ${{ vars.VITE_ENABLE_BUILDER_TOUR }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_HERO_DEMO_VIDEO_URL: ${{ vars.VITE_HERO_DEMO_VIDEO_URL }}
      VITE_HERO_DEMO_POSTER_URL: ${{ vars.VITE_HERO_DEMO_POSTER_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate public build variables
        shell: bash
        run: |
          required_variables=(
            VITE_REACT_APP_NODE_ENV
            VITE_BASE_URL
            VITE_SHARE_BASE_URL
            VITE_ENABLE_TOUR
            VITE_ENABLE_BUILDER_TOUR
            VITE_POSTHOG_KEY
            VITE_POSTHOG_HOST
            VITE_HERO_DEMO_VIDEO_URL
            VITE_HERO_DEMO_POSTER_URL
          )

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing repository variable: ${variable_name}"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Package build output
        run: tar -czf creator-dist.tar.gz -C dist .

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload build archive
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          scp -P "$VPS_PORT" \
            creator-dist.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/creator-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

      - name: Activate versioned release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "bash -s" -- "$RELEASE_ID" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          release_id="$1"
          base_directory="/var/www/feedflo/creator"
          releases_directory="${base_directory}/releases"
          release_directory="${releases_directory}/${release_id}"
          archive_path="/tmp/creator-${release_id}.tar.gz"
          temporary_link="${base_directory}/.current-${release_id}"

          mkdir -p "$release_directory"
          tar -xzf "$archive_path" -C "$release_directory"
          test -f "$release_directory/index.html"

          ln -s "$release_directory" "$temporary_link"
          mv -Tf "$temporary_link" "${base_directory}/current"
          rm -f "$archive_path"

          mapfile -t old_releases < <(
            find "$releases_directory" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%T@ %p\n' |
              sort -nr |
              tail -n +6 |
              cut -d' ' -f2-
          )

          for old_release in "${old_releases[@]}"; do
            case "$old_release" in
              "$releases_directory"/*)
                rm -rf -- "$old_release"
                ;;
            esac
          done
          REMOTE_SCRIPT